interface:
  display_name: "Adversarial Review"
  short_description: "Review artifacts through an independent Reviewer–Editor loop"
  default_prompt: "Use $adversarial-review to review this artifact until the independent Reviewer approves it."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "fork"
    shell: "bash"
    dispatch:
      prefer: "subagent"
      fallback: "inline"
      roles: ["reviewer", "editor"]
      disclosure: "required-on-simulated"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
