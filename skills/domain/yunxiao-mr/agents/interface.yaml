interface:
  display_name: "Yunxiao MR"
  short_description: "Create first-time Yunxiao single or union MRs"
  default_prompt: "Use $yunxiao-mr to plan and, after explicit confirmation, create first-time Yunxiao single-repository or union MRs without ZSpec."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
