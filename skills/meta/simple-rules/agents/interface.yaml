interface:
  display_name: "Simple Rules"
  short_description: "记录持久全局规则到 ~/.csl-agent-kit/simple-rules.md，在每次会话开始注入"
  default_prompt: "Use $simple-rules to add, edit, list, or remove a persistent rule or convention in ~/.csl-agent-kit/simple-rules.md."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
