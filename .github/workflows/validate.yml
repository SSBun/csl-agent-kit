name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-supported:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Validate supported CLI and tips runtime
        run: |
          npm ci
          npm test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate npm package and Pi hooks
        run: npm run check

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Validate Claude plugin.json
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq -e '.name and .version and .description and (.skills | type == "array")' .claude-plugin/plugin.json > /dev/null

      - name: Validate Cursor plugin.json
        run: |
          jq . .cursor-plugin/plugin.json > /dev/null
          jq -e '.name and .version and .description and .skills' .cursor-plugin/plugin.json > /dev/null

      - name: Validate Codex plugin.json
        run: |
          jq . .codex-plugin/plugin.json > /dev/null
          jq -e '.name and .version and .description and .interface.displayName' .codex-plugin/plugin.json > /dev/null

      - name: Validate marketplace manifests
        run: |
          jq . .claude-plugin/marketplace.json > /dev/null
          jq -e '.name and (.plugins | type == "array" and length > 0)' .claude-plugin/marketplace.json > /dev/null
          jq . .cursor-plugin/marketplace.json > /dev/null
          jq -e '.name and (.plugins | type == "array" and length > 0)' .cursor-plugin/marketplace.json > /dev/null
          jq . .agents/plugins/marketplace.json > /dev/null
          jq -e '.name and (.plugins | type == "array" and length > 0)' .agents/plugins/marketplace.json > /dev/null

      - name: Verify every declared Claude skill resolves
        run: |
          fail=0
          for s in $(jq -r '.skills[]' .claude-plugin/plugin.json); do
            f="${s#./}/SKILL.md"
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"
              fail=1
            fi
          done
          exit $fail

      - name: Verify skills directory is non-empty
        run: |
          count=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::skills/ has no skill directories"
            exit 1
          fi

      - name: Verify Cursor skill directory resolves
        run: |
          manifest=.cursor-plugin/plugin.json
          skills_path=$(jq -r '.skills' "$manifest" | sed 's:/*$::')
          if [ ! -d "$skills_path" ]; then
            echo "::error::$manifest skills path $skills_path is not a directory"
            exit 1
          fi
          if ! find "$skills_path" -name SKILL.md -print -quit | grep -q .; then
            echo "::error::$manifest skills path $skills_path has no skills"
            exit 1
          fi

      - name: Validate SKILL.md frontmatter
        run: |
          fail=0
          for f in $(find skills -name SKILL.md); do
            # Frontmatter must start at line 1 and contain name + description
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error::$f missing frontmatter opener"
              fail=1
              continue
            fi
            fm=$(awk '/^---$/{c++; next} c==1{print} c==2{exit}' "$f")
            name=$(echo "$fm" | awk '/^name:[[:space:]]*/{sub(/^name:[[:space:]]*/, ""); print; exit}')
            desc=$(echo "$fm" | awk '/^description:[[:space:]]*/{sub(/^description:[[:space:]]*/, ""); print; exit}')
            if [ -z "$name" ] || [ -z "$desc" ]; then
              echo "::error::$f frontmatter missing name or description"
              fail=1
            fi
            dir=$(basename "$(dirname "$f")")
            if [ "$name" != "$dir" ]; then
              echo "::error::$f frontmatter name '$name' must match directory '$dir'"
              fail=1
            fi
          done
          exit $fail

      - name: Validate command frontmatter (if commands/ exists)
        run: |
          [ -d commands ] || exit 0
          fail=0
          for f in commands/*.md; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error::$f missing frontmatter opener"
              fail=1
              continue
            fi
            fm=$(awk '/^---$/{c++; next} c==1{print} c==2{exit}' "$f")
            desc=$(echo "$fm" | awk '/^description:[[:space:]]*/{sub(/^description:[[:space:]]*/, ""); print; exit}')
            if [ -z "$desc" ]; then
              echo "::error::$f command missing description"
              fail=1
            fi
          done
          exit $fail

      - name: Validate install script syntax
        run: bash -n scripts/install.sh
